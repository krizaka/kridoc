# Security scan: gitleaks (secrets, whole history of the pull request) and zizmor (GitHub Actions vulnerabilities).
# Logic lives in krizaka/.github (reusable, rule `security-scan` of docs/standards/rules.json). Pin by commit SHA:
# `node scripts/pin-supply-chain.mjs` (and `--refresh` to move it).
name: Security scan

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

jobs:
  security:
    name: Security scan
    uses: krizaka/.github/.github/workflows/security-scan.yml@6e7d45107f720fa3e4523d52849088c379c3382c # main
    with:
      runs-on: '["self-hosted","macOS","krizaka"]' # private repository only, krizaka-internal#2939: the scan runs on the Mac runner
    permissions:
      contents: read
