name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the caches, the timeouts and the
  # gate that always reports live there. This file says only what is this product's. Keep the pinned SHA current (Dependabot).
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@93912ecf03208b718d550d902611a2827dc74139 # main
    permissions:
      contents: read
    with:
      package-manager: pnpm
      typecheck-script: typecheck
      next-cache-paths: apps/web/.next/cache
      # A real PostgreSQL for the database tests, never skipped (krizaka-internal#3717). Test values only: no real secret anywhere.
      postgres-image: postgres:16
      postgres-name: kridoc_db
      env: |
        DATABASE_URL=postgresql://kridoc_db:ci-only-password@localhost:5432/kridoc_db
      after-build: scripts/ci-after-build.sh
      # SonarCloud CI analysis with the coverage of apps/web (krizaka-internal#3553); the CTO turns Automatic Analysis off.
      sonar: true
      sonar-coverage-paths: apps/web/coverage/lcov.info
      ignore: '^docs/|^\.changeset/|^(LICENSE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.github/(ISSUE_TEMPLATE/|assets/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The job name is the required status check on main: kept by a shim that reads the gate's verdict.
  verify:
    name: Lint · Typecheck · Tests · Build
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest # public repository: GitHub-hosted, never the private Mac runner (krizaka-internal#3633)
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.ci.outputs.result }}
    steps:
      - run: test "$RESULT" = success
