sonar.projectKey=krizaka_kridoc
sonar.organization=krizaka
sonar.sources=apps/web
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/*.test.*,**/*.spec.*,**/tests/**,**/messages/**,**/*.generated.*

# The vitest report of apps/web (coverage in vitest.config.mts, passed by ci.yml sonar-coverage-paths). Without this key the scanner
# never reads it and the project shows no coverage measure (krizaka-internal#3553).
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

# Test files are tests, not sources: they never count as code to cover (founder decision 9, krizaka-internal#3490).
sonar.tests=apps/web
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/tests/**

# Not runtime code, so not measured for coverage: type declarations, build and tool config, the social card drawn once at build.
sonar.coverage.exclusions=**/*.d.ts,**/*.config.*,apps/web/app/og.png/**
