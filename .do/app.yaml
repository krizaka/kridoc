# Kridoc - DigitalOcean App Platform (TOR1), a Next.js service: www.kridoc.com (krizaka-internal#2301, founder 2026-11-03:
# a real web app from day one, the coming-soon page is its stable face and the product is built behind it).
# The app deploys from `production`, never from main: a published release fast-forwards it to the tag (.github/workflows/production.yml).
# Created by the CTO from this file; nothing here is applied by an agent. Secrets are DO SECRETs (type: SECRET, no value here), filled at apply time by the founder.
#
# ROUTES: App Platform's ingress match is prefix/exact only - NO regex. The apex answers 308 with www (the family's www rule,
# krizaka/.github#119) and everything else goes to the one component; the fine routing is the app's (proxy.ts).
name: kridoc
region: tor
domains:
  - domain: www.kridoc.com
    type: PRIMARY
  - domain: kridoc.com
    type: ALIAS
  # The development address (krizaka-internal#2659): the same app, so dev.kridoc.com answers until a dev deployment of its own exists.
  - domain: dev.kridoc.com
    type: ALIAS
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
ingress:
  rules:
    - match:
        authority:
          exact: kridoc.com
      redirect:
        authority: www.kridoc.com
        redirect_code: 308
    - match:
        path:
          prefix: /
      component:
        name: web
services:
  - name: web
    github:
      repo: krizaka/kridoc
      branch: production
      deploy_on_push: true
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/healthz
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: APP_PUBLIC_URL
        scope: RUN_TIME
        value: https://www.kridoc.com
      - key: APP_COMMIT_SHA
        scope: BUILD_TIME
        value: ${_self.COMMIT_HASH}
      # The public face of Kridoc: indexed.
      - key: APP_SEARCH_INDEXING
        scope: RUN_AND_BUILD_TIME
        value: "on"
      # Kridoc's own database (krizaka-internal#3717): off until the dev database exists, so a missing key never takes the site down.
      # With DATABASE_ENABLED on, the boot requires DATABASE_URL and DATABASE_CA_CERT (apps/web/lib/env.ts). Values by the founder, in the secret store.
      - key: DATABASE_ENABLED
        scope: RUN_TIME
        value: "off"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
      # Kridoc's own accounts (krizaka-internal#3718): off until the founder turns them on. With AUTH_ENABLED on, the boot requires
      # DATABASE_ENABLED on and AUTH_SESSION_SECRET of 32 characters or more (apps/web/lib/env.ts). AUTH_SIGNUP stays closed:
      # the first administrator is made with `pnpm auth:create-admin`.
      - key: AUTH_ENABLED
        scope: RUN_TIME
        value: "off"
      - key: AUTH_SIGNUP
        scope: RUN_TIME
        value: closed
      - key: AUTH_SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      # Kridoc's own documents (krizaka-internal#3719): off until the founder turns them on. With MEDIA_STORAGE_ENABLED on, the boot
      # requires AUTH_ENABLED on, the s3 provider, MEDIA_DOCUMENTS_TENANT, MEDIA_VAULT_KEY and the bucket's settings with a Canadian region (Law 25,
      # apps/web/lib/env.ts). Bucket and keys by the founder, in the secret store.
      - key: MEDIA_STORAGE_ENABLED
        scope: RUN_TIME
        value: "off"
      - key: MEDIA_STORAGE_PROVIDER
        scope: RUN_TIME
        value: s3
      - key: MEDIA_DOCUMENTS_TENANT
        scope: RUN_TIME
        value: kridoc-prod
      # The root key that wraps each account's key (krizaka-internal#3754): 32 bytes in base64, required when the feature is on.
      - key: MEDIA_VAULT_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MEDIA_S3_ENDPOINT
        scope: RUN_TIME
        value: https://tor1.digitaloceanspaces.com
      - key: MEDIA_S3_REGION
        scope: RUN_TIME
        value: tor1
      - key: MEDIA_S3_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: MEDIA_S3_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
