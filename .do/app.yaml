# Kridoc - DigitalOcean App Platform (TOR1), a Next.js service: www.kridoc.com (krizaka-internal#2301, founder 2026-11-03:
# a real web app from day one, the coming-soon page is its stable face and the product is built behind it).
# The app deploys from `production`, never from main: a published release fast-forwards it to the tag (.github/workflows/production.yml).
# Created by the CTO from this file; nothing here is applied by an agent. Secrets are DO SECRETs (type: SECRET, no value here), filled at apply time by the founder.
#
# ROUTES: App Platform's ingress match is prefix/exact only - NO regex. The apex answers 308 with www (the family's www rule,
# krizaka/.github#119) and everything else goes to the one component; the fine routing is the app's (proxy.ts).
name: kridoc
region: tor
domains:
  - domain: www.kridoc.com
    type: PRIMARY
  - domain: kridoc.com
    type: ALIAS
  # The development address (krizaka-internal#2659): the same app, so dev.kridoc.com answers until a dev deployment of its own exists.
  - domain: dev.kridoc.com
    type: ALIAS
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
ingress:
  rules:
    - match:
        authority:
          exact: kridoc.com
      redirect:
        authority: www.kridoc.com
        redirect_code: 308
    - match:
        path:
          prefix: /
      component:
        name: web
services:
  - name: web
    github:
      repo: krizaka/kridoc
      branch: production
      deploy_on_push: true
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/healthz
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: APP_PUBLIC_URL
        scope: RUN_TIME
        value: https://www.kridoc.com
      - key: APP_COMMIT_SHA
        scope: BUILD_TIME
        value: ${_self.COMMIT_HASH}
      # The public face of Kridoc: indexed.
      - key: APP_SEARCH_INDEXING
        scope: RUN_AND_BUILD_TIME
        value: "on"
      # No database and no accounts yet: DATABASE_URL, DATABASE_CA_CERT and AUTH_SESSION_SECRET (DO SECRETs) are declared here by the slice
      # that brings their feature (krizaka-internal#3717, #3718), together with their requirement in apps/web/lib/env.ts.
