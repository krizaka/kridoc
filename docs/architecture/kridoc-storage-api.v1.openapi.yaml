openapi: 3.1.0
info:
  title: Kridoc storage API for Krizaka's products
  version: 1.1.0
  summary: Objects of one product's tenant behind a bearer token, sealed under that tenant's key, data in Canada (krizaka-internal#3756).
  description: |
    The contract of `/api/storage/v1` (slice 5 of krizaka-internal#3719; design in `docs/design/storage-service.md`). **Built**: the
    routes are `apps/web/app/api/storage/v1/**`, behind `MEDIA_STORAGE_ENABLED` (off by default: every route answers 404
    `STORAGE_API_OFF`).

    **Tenancy.** A client is one product in one environment (`verikora-prod`). Its tenant is its token's, never a field of the request:
    a key is `a/b/name.ext` (`assertKey` of `@krizaka/storage`), joined under the tenant's prefix, so another tenant's objects cannot
    even be named; another tenant's object is « not found ».

    **Tokens.** `kst1.<43 base64url>` (256 random bits), issued by an administrator (`pnpm storage:client issue`), shown once; Kridoc
    keeps only its keyed hash. Scopes: `put`, `get` (get, head, list), `delete`, `sign`. Rotation: issue a second, revoke the first.

    **Encryption.** Every object is sealed under its tenant's own key (`tenantStore` / `tenantVault`): the bucket holds ciphertext only.

    **Behaviour.** The behavioural contract is `objectStoreContract` of `@krizaka/storage/testkit`: Kridoc runs it against these
    routes through its reference client (`apps/web/lib/storage/kridoc-api-store.ts`), and Verikora's `kridoc` provider runs the same.

    **Server to server only.** No CORS. A browser gets at most one signed link to one object, valid a few minutes.

    **v1.1 (krizaka-internal#4041).** All additive: nothing a v1.0 client relies on changed. `PUT` takes `Repr-Digest: sha-256=:<base64>:` (RFC 9530): Kridoc hashes what it
    received and refuses a mismatch with `400 STORAGE_DIGEST_MISMATCH`, nothing written. `PUT` with `If-None-Match: *` never replaces: the
    same bytes answer `200` + `Idempotent-Replayed: true`, other bytes `412 STORAGE_OBJECT_EXISTS`. The SHA-256 (hex) is in
    `StoredObject.sha256` / `ObjectInfo.sha256` and `Repr-Digest` on GET and HEAD (computed from the opened bytes: the sealed store keeps
    no digest beside them). `DELETE` answers `200` with the deletion record; a missing key `{ key, absent: true }`. The record is
    written to the audit ledger (hash of the key, record id, digest, size); the dedicated purge ledger of #3499 is not built yet.
    **List** takes `after` (the last key seen) and `limit` and answers `{ objects, next, truncated }`: `next` is the `after` of the next page,
    `null` on the last. `GET /ping` tells the tenant, the scopes, the key's expiry (`null`: keys are revoked, they do not expire) and the
    API's version; `GET /usage` tells `{ bytes, objects, quota }`. The **quota** (bytes and objects per tenant) is a setting of Kridoc's
    storage admin: a write past it is refused before any byte is kept, `403 STORAGE_QUOTA_EXCEEDED` (a create-only replay writes nothing
    and is still answered; bytes are what the store holds, sealing included). **`X-Request-Id`** is on every answer: the caller's, when it
    is 1 to 128 characters of letters, digits, `.`, `_` or `-`, else a generated one; a refusal repeats it in its `instance`
    (`urn:kridoc:request:<id>`). **Create-only is atomic** inside one Kridoc instance: of two concurrent writes of one key with different
    bytes exactly one wins and the other is `412`. TypeScript types of this document are generated
    (`apps/web/lib/storage/generated/storage-api.d.ts`) and a test fails when they drift.

    **Refusals** are Problem Details (RFC 9457) with a stable `code`: `STORAGE_API_OFF` 404, `STORAGE_UNAUTHENTICATED` 401,
    `STORAGE_SCOPE_REFUSED` 403, `STORAGE_OBJECT_NOT_FOUND` 404, `STORAGE_KEY_REFUSED` 400, `STORAGE_OBJECT_TOO_BIG` 413,
    `STORAGE_TYPE_REFUSED` 415, `STORAGE_LINK_REFUSED` 403, `STORAGE_DIGEST_MISMATCH` 400, `STORAGE_OBJECT_EXISTS` 412, `STORAGE_QUOTA_EXCEEDED` 403, `STORAGE_INVALID_INPUT` 400, `RATE_LIMITED` 429 (with `Retry-After`),
    `INTERNAL` 500.
servers:
  - url: https://www.kridoc.com
security:
  - storageToken: []
paths:
  /api/storage/v1/objects/{key}:
    parameters:
      - $ref: "#/components/parameters/Key"
    put:
      operationId: putObject
      summary: Keeps an object (the raw body); an existing key is replaced, unless `If-None-Match` is `*` (create-only).
      parameters:
        - name: Repr-Digest
          in: header
          required: false
          description: "`sha-256=:<base64>:` of the body (RFC 9530); a mismatch writes nothing."
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          description: "`*`: create-only. The same bytes under the same key are a replay (200); other bytes are 412."
          schema: { type: string, enum: ["*"] }
      description: |
        The declared `Content-Type` must be one the settings accept (`SETTINGS.storageApi.types`); bytes of a known type (magic number)
        must be that type, and may not hide under `application/octet-stream` (the type of a product's own ciphertext). At most
        `SETTINGS.storageApi.maxBytes`, never empty.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Kept.
          headers:
            Repr-Digest: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [object]
                properties:
                  object: { $ref: "#/components/schemas/StoredObject" }
        "200":
          description: Create-only replay, the same bytes were already there (`Idempotent-Replayed true`).
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ["true"] } }
            Repr-Digest: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [object]
                properties:
                  object: { $ref: "#/components/schemas/StoredObject" }
        "412": { $ref: "#/components/responses/Refusal" }
        "400": { $ref: "#/components/responses/Refusal" }
        "401": { $ref: "#/components/responses/Refusal" }
        "403": { $ref: "#/components/responses/Refusal" }
        "413": { $ref: "#/components/responses/Refusal" }
        "415": { $ref: "#/components/responses/Refusal" }
        "429": { $ref: "#/components/responses/Refusal" }
    get:
      operationId: getObject
      summary: The object's bytes, as an attachment (its stored type, `nosniff`, never cached).
      responses:
        "200":
          description: The bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Refusal" }
        "403": { $ref: "#/components/responses/Refusal" }
        "404": { $ref: "#/components/responses/Refusal" }
    head:
      operationId: headObject
      summary: The object's size (`Content-Length`), without its bytes.
      responses:
        "200": { description: It exists. }
        "404": { description: No such object. }
    delete:
      operationId: deleteObject
      summary: Deletes the object and answers its deletion record; deleting a missing one is not an error.
      responses:
        "200":
          description: "The deletion record, or `{ key, absent: true }` when there was nothing."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DeletionRecord"
                  - type: object
                    required: [key, absent]
                    properties:
                      key: { type: string }
                      absent: { type: boolean, enum: [true] }
        "401": { $ref: "#/components/responses/Refusal" }
        "403": { $ref: "#/components/responses/Refusal" }
  /api/storage/v1/objects:
    get:
      operationId: listObjects
      summary: The tenant's objects whose key starts with `prefix`, in key order, one page at a time (at most `SETTINGS.storageApi.listMax`).
      parameters:
        - name: prefix
          in: query
          required: false
          schema: { type: string, default: "" }
        - name: after
          in: query
          required: false
          description: The last key of the page before (exclusive); omit for the first page.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: "The page size, a whole number from 1; capped by the settings' bound (default: the bound)."
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The objects.
          content:
            application/json:
              schema:
                type: object
                required: [objects, next, truncated]
                properties:
                  objects:
                    type: array
                    items: { $ref: "#/components/schemas/ObjectInfo" }
                  next:
                    type: [string, "null"]
                    description: The `after` of the next page; `null` on the last page.
                  truncated: { type: boolean, description: "True when there is a next page." }
        "400": { $ref: "#/components/responses/Refusal" }
        "401": { $ref: "#/components/responses/Refusal" }
  /api/storage/v1/ping:
    get:
      operationId: ping
      summary: Who the token is. Any authenticated client may ask.
      responses:
        "200":
          description: The client's tenant, scopes, key expiry and the API's version.
          content:
            application/json:
              schema:
                type: object
                required: [tenant, scopes, keyExpiresAt, api]
                properties:
                  tenant: { type: string }
                  scopes:
                    type: array
                    items: { type: string, enum: [put, get, delete, sign] }
                  keyExpiresAt:
                    type: [string, "null"]
                    format: date-time
                    description: "`null` while keys do not expire (they are revoked)."
                  api: { type: string, description: "The contract's version, `info.version`." }
        "401": { $ref: "#/components/responses/Refusal" }
        "429": { $ref: "#/components/responses/Refusal" }
  /api/storage/v1/usage:
    get:
      operationId: usage
      summary: What the tenant keeps and what it may keep (scope `get`).
      responses:
        "200":
          description: Bytes and objects kept, and the quota of the storage settings.
          content:
            application/json:
              schema:
                type: object
                required: [bytes, objects, quota]
                properties:
                  bytes: { type: integer, description: "What the store holds for the tenant, sealing included." }
                  objects: { type: integer }
                  quota:
                    type: object
                    required: [bytes, objects]
                    properties:
                      bytes: { type: integer }
                      objects: { type: integer }
        "401": { $ref: "#/components/responses/Refusal" }
        "403": { $ref: "#/components/responses/Refusal" }
        "429": { $ref: "#/components/responses/Refusal" }
  /api/storage/v1/links/{key}:
    parameters:
      - $ref: "#/components/parameters/Key"
    post:
      operationId: signObjectLink
      summary: A signed link to one object, for a browser or a worker without the token (scope `sign`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttlSeconds:
                  { type: integer, minimum: 1, description: "Capped by SETTINGS.storageApi.signedUrlSeconds (300 s)." }
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Refusal" }
        "403": { $ref: "#/components/responses/Refusal" }
    get:
      operationId: readObjectLink
      summary: The object a signed link names, while it lives and its client is not revoked. No token.
      security: []
      parameters:
        - { name: client, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: expires, in: query, required: true, schema: { type: string, pattern: "^[0-9]{1,12}$" } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Refusal" }
        "404": { $ref: "#/components/responses/Refusal" }
components:
  securitySchemes:
    storageToken:
      type: http
      scheme: bearer
      bearerFormat: kst1
  parameters:
    Key:
      name: key
      in: path
      required: true
      description: "`a/b/name.ext`, each segment percent-encoded: no empty segment, no `.` or `..`, no backslash, at most 512 characters."
      schema: { type: string }
  schemas:
    ObjectInfo:
      type: object
      required: [key, size]
      properties:
        key: { type: string }
        size: { type: integer }
        sha256: { type: string, description: "Hex SHA-256 of the object (v1.1; absent in a list)." }
    StoredObject:
      type: object
      required: [key, size, contentType]
      properties:
        key: { type: string }
        size: { type: integer }
        contentType: { type: string }
        sha256: { type: string, description: "Hex SHA-256 of the bytes received (v1.1)." }
    DeletionRecord:
      type: object
      required: [key, deletedAt, sha256, size, recordId]
      properties:
        key: { type: string }
        deletedAt: { type: string, format: date-time }
        sha256: { type: string }
        size: { type: integer }
        recordId: { type: string, description: "`del_` + 24 hex, derived from tenant, key, time and digest." }
  responses:
    Refusal:
      description: A refusal (Problem Details).
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code, detail]
            properties:
              instance: { type: string, description: "`urn:kridoc:request:` + the answer's `X-Request-Id`." }
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              code:
                type: string
                enum:
                  - STORAGE_API_OFF
                  - STORAGE_UNAUTHENTICATED
                  - STORAGE_SCOPE_REFUSED
                  - STORAGE_OBJECT_NOT_FOUND
                  - STORAGE_KEY_REFUSED
                  - STORAGE_OBJECT_TOO_BIG
                  - STORAGE_TYPE_REFUSED
                  - STORAGE_LINK_REFUSED
                  - STORAGE_DIGEST_MISMATCH
                  - STORAGE_OBJECT_EXISTS
                  - STORAGE_QUOTA_EXCEEDED
                  - STORAGE_INVALID_INPUT
                  - RATE_LIMITED
                  - INTERNAL
              detail: { type: string }
